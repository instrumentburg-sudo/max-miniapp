<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#141414" />
    <title>ИнструментБург</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <style>
      body { margin: 0; background: #141414; color: #fff; font-family: 'DM Sans', sans-serif; }
      #loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 12px; }
      #loading .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #F59E0B; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #loading .text { font-size: 14px; opacity: 0.6; }
      #error-box { display: none; padding: 20px; margin: 20px; background: #2a1a1a; border: 1px solid #f44; border-radius: 12px; font-size: 13px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <div class="spinner"></div>
        <div class="text">Загрузка...</div>
      </div>
    </div>
    <div id="error-box"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('error-box');
        if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + msg + ' at ' + src + ':' + line; }
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('error-box');
        if (el) { el.style.display = 'block'; el.textContent = 'Promise: ' + (e.reason ? e.reason.message || e.reason : 'unknown'); }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
